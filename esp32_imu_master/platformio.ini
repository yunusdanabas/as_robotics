; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial communication settings
monitor_speed = 115200
upload_speed = 921600

; micro-ROS configuration
board_microros_distro = jazzy
board_microros_transport = wifi

build_flags =
    -O3
    -ffast-math
    -DCORE_DEBUG_LEVEL=0
    -DPOSITION_MODE=0
    -DENABLE_DIAGNOSTIC_LOGGING=0
    -DBLOCKING_STATUS_CHECK=0
    -DGLITCH_THRESHOLD_RAD_VALUE=0.25
    -DALWAYS_ON_SMOOTHING_ALPHA_VALUE=0.15
    -DPERSISTENT_GLITCH_COUNT=10

; Library dependencies
lib_deps = 
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit BMP280 Library @ ^2.6.8

[env:esp32dev_position]
extends = env:esp32dev
build_flags =
    -DPOSITION_MODE=1
    -DENABLE_DIAGNOSTIC_LOGGING=0
    -DBLOCKING_STATUS_CHECK=0

[env:esp32dev_dual]
extends = env:esp32dev
build_flags =
    -O3
    -ffast-math
    -DCORE_DEBUG_LEVEL=0
    -DPOSITION_MODE=0
    -DDUAL_IMU_MODE=1
    -DENABLE_DIAGNOSTIC_LOGGING=0
    -DBLOCKING_STATUS_CHECK=0
    -DGLITCH_THRESHOLD_RAD_VALUE=0.25
    -DALWAYS_ON_SMOOTHING_ALPHA_VALUE=0.15
    -DPERSISTENT_GLITCH_COUNT=10

; Additional libraries for dual IMU mode (MPU6050)
; Note: Magnetometer libraries kept for future use but magnetometer is disabled
lib_deps = 
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit AHRS @ ^2.3.5

[env:esp32dev_mpu6050]
extends = env:esp32dev
build_flags =
    -DPOSITION_MODE=0
    -DMPU6050_ONLY_MODE=1
    -DENABLE_DIAGNOSTIC_LOGGING=0
    -DBLOCKING_STATUS_CHECK=0

; Libraries for MPU6050-only mode (testing second IMU alone)
lib_deps = 
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit HMC5883 Unified @ ^1.2.3
    mprograms/QMC5883LCompass @ ^1.2.3
    adafruit/Adafruit AHRS @ ^2.3.5
    adafruit/Adafruit BMP085 Library @ ^1.2.4

; Debug environment with enhanced diagnostic logging (10 Hz logging rate)
[env:esp32dev_debug]
extends = env:esp32dev
build_flags =
    -O2
    -DPOSITION_MODE=0
    -DENABLE_DIAGNOSTIC_LOGGING=1
    -DBLOCKING_STATUS_CHECK=0
    -DGLITCH_THRESHOLD_RAD_VALUE=0.25
    -DALWAYS_ON_SMOOTHING_ALPHA_VALUE=0.15
    -DPERSISTENT_GLITCH_COUNT=10
    -DDIAGNOSTIC_LOG_INTERVAL_MS=100
    ; Log at 10 Hz (100ms interval) to avoid serial overflow at 50 Hz publish rate
